[forAnyModule]
allowedOpenUnaliasedImports = 1
moduleHeaderCopyrightMustExistNonEmpty = false
moduleHeaderDescriptionMustExistNonEmpty = false
moduleHeaderLicenseMustExistNonEmpty = false
moduleHeaderMaintainerMustExistNonEmpty = false
encapsulatedTrees = []
# Test suites: same import rules as henforcer.toml, without the layering
# (treeDependencies) rules, because tests exercise layers across boundaries.
# scripts/lib/check-henforcer-configs keeps the two files otherwise identical.

[[forAnyModule.allowedQualifications]]
module = "Flipstone.Prelude"
[[forAnyModule.allowedQualifications.importScheme]]
qualified = { unqualified = true }

[[forAnyModule.allowedQualifications]]
module = "Data.ByteString"
[[forAnyModule.allowedQualifications.importScheme]]
qualified = { qualifiedPost = true }
alias = "BS"

[[forAnyModule.allowedQualifications]]
module = "Data.ByteString.Lazy"
[[forAnyModule.allowedQualifications.importScheme]]
qualified = { qualifiedPost = true }
alias = "LBS"

[[forAnyModule.allowedQualifications]]
module = "Data.Text"
[[forAnyModule.allowedQualifications.importScheme]]
qualified = { qualifiedPost = true }
alias = "T"

[[forAnyModule.allowedQualifications]]
module = "Orb"
[[forAnyModule.allowedQualifications.importScheme]]
qualified = { qualifiedPost = true }

[[forAnyModule.allowedQualifications]]
module = "Orville.PostgreSQL"
[[forAnyModule.allowedQualifications.importScheme]]
qualified = { qualifiedPost = true }
alias = "O"

[[forAnyModule.allowedQualifications]]
module = "Data.Vector"
[[forAnyModule.allowedQualifications.importScheme]]
qualified = { qualifiedPost = true }
alias = "V"

