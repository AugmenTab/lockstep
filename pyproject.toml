[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lockstep"
dynamic = ["version"]
description = "Local-first supervised AI software-development orchestration tool"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
lockstep = "lockstep.cli.app:app"

[tool.hatch.version]
path = "src/lockstep/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lockstep"]
