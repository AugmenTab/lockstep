[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lockstep"
dynamic = ["version"]
description = "Local-first supervised AI software-development orchestration tool"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
lockstep = "lockstep.cli.app:app"

[tool.hatch.version]
path = "src/lockstep/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lockstep"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "N",    # pep8-naming
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N802"]
# The architecture test is Planner-authored and frozen verbatim; its
# import block spacing must not be reformatted by ruff's isort rule.
"tests/test_architecture_packages.py" = ["I001", "N802"]
# The domain artifact tests are Planner-authored and frozen verbatim;
# their intentional `TestSpecification as DomainTestSpecification`
# alias must not be split into its own import block by isort.
"tests/test_domain_planning_artifacts.py" = ["I001", "N802"]
"tests/test_domain_execution_artifacts.py" = ["I001", "N802"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/lockstep"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
