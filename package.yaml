name:                lockstep
version:             0.2.0.0
github:              "AugmenTab/lockstep"
# Lockstep v2 is private and has no chosen license (ADR-0001 C2). Portions
# derived from Launchpad 11886bf are BSD-3-Clause; see LICENSE-LAUNCHPAD.
license:             NONE
author:              "Tyler Baum"
maintainer:          "Tyler Baum"
copyright:           "2026 Tyler Baum; Launchpad-derived portions 2023 Tyler Baum"

extra-source-files:
- LICENSE-LAUNCHPAD
- henforcer.toml
- henforcer-tests.toml
- THIRD_PARTY_LICENSES.md
- static/*

description: Lockstep v2 local application (private).

dependencies:
  - base
  - flipstone-prelude
  - henforcer

language: GHC2021

default-extensions:
  - NoImplicitPrelude

ghc-options:
  - -j
  - -Weverything
  - -Werror
  - -Wno-missing-import-lists
  - -Wno-missing-local-signatures
  - -Wno-monomorphism-restriction
  - -Wno-missing-kind-signatures
  - -Wno-prepositive-qualified-module
  - -Wno-implicit-prelude
  - -Wno-safe
  - -Wno-unsafe
  - -Wno-missing-safe-haskell-mode
  - -Wno-missing-deriving-strategies
  - -Wno-all-missed-specialisations
  - -Wno-missed-specialisations
  - -Wno-unticked-promoted-constructors
  - -fplugin Henforcer

library:
  source-dirs: src
  dependencies:
    - beeline-routing
    - brigid
    - bytestring
    - containers
    - cookie
    - crypton
    - directory
    - fast-logger
    - file-embed
    - http-types
    - json-fleece-aeson
    - json-fleece-core
    - memory
    - mtl
    - non-empty-text
    - ogma
    - orb
    - orville-postgresql
    - postgresql-libpq
    - process
    - safe-exceptions
    - shrubbery
    - string-interpolate
    - text
    - time
    - unix
    - unliftio
    - uuid
    - uuid-types
    - wai
    - warp

executables:
  lockstep:
    main:        Main.hs
    source-dirs: app/lockstep
    dependencies:
      - lockstep
      - fast-logger
      - safe-exceptions
      - text
      - warp
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-T
    when:
      - condition: false
        other-modules: Paths_lockstep

tests:
  lockstep-unit:
    main:        Main.hs
    source-dirs: test/unit
    dependencies:
      - lockstep
      - brigid
      - bytestring
      - http-types
      - QuickCheck
      - tasty
      - tasty-hunit
      - tasty-quickcheck
      - text
      - time
      - wai
      - wai-extra
      - warp
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-T
      - -fplugin-opt=Henforcer:--config=henforcer-tests.toml
    when:
      - condition: false
        other-modules: Paths_lockstep
  # C-P4.R1 R-S3: run on its own (stack test lockstep:lockstep-stress); a 96 MiB heap.
  lockstep-stress:
    main:        Main.hs
    source-dirs: test/stress
    dependencies:
      - lockstep
      - bytestring
      - directory
      - process
      - tasty
      - tasty-hunit
      - temporary
      - text
    ghc-options:
      - -threaded
      - -rtsopts
      - "\"-with-rtsopts=-M96m -T\""
      - -fplugin-opt=Henforcer:--config=henforcer-tests.toml
    when:
      - condition: false
        other-modules: Paths_lockstep
  # Stack-compliance pass (2026-11-07): behaviour checks for the Orville and
  # Fleece conversions, kept apart from the frozen suites. Needs LOCKSTEP_TEST_PG_*.
  lockstep-compliance:
    main:        Main.hs
    source-dirs: test/compliance
    dependencies:
      - lockstep
      - brigid
      - bytestring
      - http-types
      - containers
      - crypton
      - json-fleece-aeson
      - memory
      - orville-postgresql
      - should-not-typecheck
      - tasty
      - tasty-hunit
      - text
      - time
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-T
      - -fplugin-opt=Henforcer:--config=henforcer-tests.toml
    when:
      - condition: false
        other-modules: Paths_lockstep
  # Phase 5 (docs/architecture/dev-capsules.md): the Capsule Runtime's typed vocabulary against the
  # runtime script's own words; run from the checkout's root. Apart from the frozen suites.
  lockstep-capsule:
    main:        Main.hs
    source-dirs: test/capsule
    dependencies:
      - lockstep
      - bytestring
      - directory
      - process
      - tasty
      - tasty-hunit
      - temporary
      - text
      - unix
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-T
      - -fplugin-opt=Henforcer:--config=henforcer-tests.toml
    when:
      - condition: false
        other-modules: Paths_lockstep
  # Phase 5 P5.11: the Gate C-EXEC journey with every run in real Dev Capsules; needs the host helper in
  # capsule mode (scripts/lib/check-capsule-e2e), so it is not part of scripts/check.
  lockstep-capsule-e2e:
    main:        Main.hs
    source-dirs:
      - test/capsule-e2e
      - test/integration
    other-modules:
      - Lockstep.Support.Postgres
      - Lockstep.Support.Process
    dependencies:
      - lockstep
      - bytestring
      - directory
      - http-client
      - http-types
      - network
      - orville-postgresql
      - process
      - tasty
      - tasty-hunit
      - temporary
      - text
      - time
      - unix
    build-tools:
      - lockstep:lockstep
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-T
      - -fplugin-opt=Henforcer:--config=henforcer-tests.toml
    when:
      - condition: false
        other-modules: Paths_lockstep
  lockstep-integration:
    main:        Main.hs
    source-dirs: test/integration
    build-tools:
      - lockstep:lockstep
    dependencies:
      - lockstep
      - bytestring
      - directory
      - http-client
      - http-types
      - network
      - orville-postgresql
      - process
      - tasty
      - tasty-hunit
      - temporary
      - text
      - time
      - unix
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-T
      - -fplugin-opt=Henforcer:--config=henforcer-tests.toml
    when:
      - condition: false
        other-modules: Paths_lockstep
